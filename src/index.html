<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Cathéo - Paroisse Cœur Immaculé de Marie</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Inter:wght@300;400;500;600;700;800&family=Nunito:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script>
    (function() {
      try {
        var raw = localStorage.getItem('catheo_apparence_theme');
        if (raw) {
          var t = JSON.parse(raw);
          if (t && t.primary) {
            document.documentElement.style.setProperty('--primary-600', t.primary);
          }
          if (t && t.secondary) {
            document.documentElement.style.setProperty('--accent-600', t.secondary);
          }
          if (t && t.font) {
            var f = '"' + t.font + '", "Plus Jakarta Sans", "Inter", sans-serif';
            document.documentElement.style.setProperty('--font-family-sans', f);
          }
        }
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
