@if (showAppLayout()) {
  <div class="app-layout">
    <!-- Reusable Sidebar -->
    <app-sidebar />

    <!-- Main Content Area with Header & Router View -->
    <div class="app-main-wrapper">
      <app-header />

      <main class="app-content-view">
        <router-outlet />
      </main>

      <app-footer />
    </div>
  </div>
} @else {
  <!-- Routes publiques : login, forgot-password, préinscription, etc. -->
  <router-outlet />
}

<!-- Unified Global Toast Container -->
<app-toast />

<!-- Unified Global Native PDF Preview Modal -->
<app-pdf-preview-modal />
