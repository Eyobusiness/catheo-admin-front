<app-dialog
  [isOpen]="isOpen()"
  title="Annuler / Supprimer une Inscription"
  size="sm"
  (closed)="onClose()"
>
  @if (itemToDelete(); as item) {
    <div class="delete-modal-body">
      <div class="warning-icon-box">
        <i class="bi bi-exclamation-triangle-fill"></i>
      </div>

      <div class="delete-message">
        <h4 class="delete-title">Supprimer l'inscription annuelle ?</h4>
        <p class="delete-desc">
          Êtes-vous sûr de vouloir supprimer l'inscription <strong>{{ item.code_inscription }}</strong> de
          <strong>{{ item.catechumene?.nom }} {{ item.catechumene?.prenoms }}</strong> ?
        </p>
      </div>

      <div class="modal-footer-actions">
        <app-button type="button" variant="ghost" (clicked)="onClose()" [disabled]="isLoading()">
          Annuler
        </app-button>
        <app-button type="button" variant="danger" [loading]="isLoading()" (clicked)="onConfirm()">
          <i class="bi bi-trash3"></i>
          <span>Supprimer</span>
        </app-button>
      </div>
    </div>
  }
</app-dialog>
