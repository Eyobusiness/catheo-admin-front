<div class="change-pass-viewport">
  <!-- En-tête -->
  <div class="page-top-nav">
    <a routerLink="/animateur/profil" class="back-link-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      <span>Mon profil</span>
    </a>
    <h1 class="page-title">Sécurité</h1>
  </div>

  <div class="change-pass-card">
    <div class="card-header">
      <h2 class="card-title">Changer de mot de passe</h2>
      <p class="card-subtitle">Entrez votre mot de passe actuel puis définissez votre nouveau mot de passe.</p>
    </div>

    @if (errorMessage()) {
      <div class="alert error-alert" role="alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="pass-form">
      <!-- Mot de passe actuel -->
      <div class="form-group">
        <label class="form-label">Mot de passe actuel <span class="required">*</span></label>
        <div class="input-wrap">
          <input
            [type]="showOldPass() ? 'text' : 'password'"
            formControlName="current_password"
            placeholder="Votre mot de passe actuel"
            class="form-control"
          />
          <button type="button" class="pass-toggle" (click)="showOldPass.set(!showOldPass())">
            {{ showOldPass() ? 'Masquer' : 'Afficher' }}
          </button>
        </div>
      </div>

      <!-- Nouveau mot de passe -->
      <div class="form-group">
        <label class="form-label">Nouveau mot de passe <span class="required">*</span></label>
        <div class="input-wrap">
          <input
            [type]="showNewPass() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Minimum 6 caractères"
            class="form-control"
          />
          <button type="button" class="pass-toggle" (click)="showNewPass.set(!showNewPass())">
            {{ showNewPass() ? 'Masquer' : 'Afficher' }}
          </button>
        </div>
      </div>

      <!-- Confirmation -->
      <div class="form-group">
        <label class="form-label">Confirmer le nouveau mot de passe <span class="required">*</span></label>
        <input
          [type]="showNewPass() ? 'text' : 'password'"
          formControlName="password_confirmation"
          placeholder="Retapez le nouveau mot de passe"
          class="form-control"
        />
      </div>

      <button
        type="submit"
        class="save-btn"
        [disabled]="isLoading() || passwordForm.invalid"
      >
        @if (isLoading()) {
          <span class="spinner-white"></span>
          <span>Modification en cours...</span>
        } @else {
          <span>Valider le changement</span>
        }
      </button>
    </form>
  </div>
</div>
