<app-dialog
  [isOpen]="isOpen()"
  [title]="isEditing() ? 'Modifier le Niveau' : 'Créer un Niveau'"
  subtitle="Organisation • Niveaux de Catéchèse"
  size="md"
  (closed)="onClose()"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" dialog-body class="niveau-form">
    <!-- Section Parent Selection -->
    <div class="form-group">
      <label class="form-label" for="sectionId">
        Section de Catéchèse <span class="required">*</span>
      </label>
      <select id="sectionId" formControlName="section_id" class="form-control">
        <option value="" disabled>Sélectionner une section</option>
        @for (sec of sections(); track sec.id) {
          <option [value]="sec.id">{{ sec.nom }}</option>
        }
      </select>
      @if (form.controls.section_id.touched && form.controls.section_id.invalid) {
        <span class="field-error">Veuillez sélectionner une section.</span>
      }
    </div>

    <!-- Nom du Niveau -->
    <div class="form-group">
      <label class="form-label" for="nom">
        Nom du Niveau <span class="required">*</span>
      </label>
      <input
        id="nom"
        type="text"
        formControlName="nom"
        class="form-control"
        placeholder="Nom"
      />
      @if (form.controls.nom.touched && form.controls.nom.invalid) {
        <span class="field-error">Le nom est obligatoire.</span>
      }
    </div>

    <!-- Description -->
    <div class="form-group">
      <label class="form-label" for="description">Description</label>
      <input
        id="description"
        type="text"
        formControlName="description"
        class="form-control"
        placeholder="Description"
      />
    </div>

    <!-- Ordre d'affichage & Statut Row -->
    <div class="form-row col-2">
      <div class="form-group">
        <label class="form-label" for="ordreAffichage">Ordre d'affichage</label>
        <input
          id="ordreAffichage"
          type="number"
          formControlName="ordre_affichage"
          class="form-control"
          placeholder="1"
          min="1"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="statut">Statut</label>
        <select id="statut" formControlName="statut" class="form-control">
          <option value="actif">Actif</option>
          <option value="inactif">Inactif</option>
        </select>
      </div>
    </div>
  </form>

  <div dialog-footer>
    <app-button variant="secondary" (clicked)="onClose()">
      Annuler
    </app-button>
    <app-button
      variant="primary"
      icon="check"
      [loading]="isLoading()"
      (clicked)="onSubmit()"
    >
      {{ isEditing() ? 'Enregistrer' : 'Créer' }}
    </app-button>
  </div>
</app-dialog>
