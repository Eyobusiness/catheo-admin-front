<div class="affectations-page">
  <!-- Topbar Header -->
  <section class="page-topbar">
    <div class="topbar-headings">
      <h2 class="topbar-title">Affectation des Catéchistes</h2>
      <p class="topbar-subtitle">Attribution classe de catéchèse.</p>
    </div>

    <div class="topbar-actions">
      <app-button
        variant="primary"
        size="md"
        icon="plus"
        (clicked)="openCreateModal()"
      >
        Nouvelle Affectation
      </app-button>
    </div>
  </section>

  <!-- Main Table Card -->
  <app-card
    title="Tableau des Affectations">
    <!-- Table Controls Toolbar -->
    <div class="filters-toolbar">
      <!-- Left Filters Group -->
      <div class="filters-left">
        <!-- Search Input -->
        <div class="search-input-wrapper">
          <i class="bi bi-search search-icon"></i>
          <input
            type="text"
            class="filter-search-control"
            placeholder="Rechercher..."
            [value]="searchQuery()"
            (input)="onSearchChange($event)"
          />
          @if (searchQuery()) {
            <button class="clear-search-btn" (click)="clearSearch()" title="Effacer la recherche">
              <i class="bi bi-x-circle-fill"></i>
            </button>
          }
        </div>

        <!-- Role Filter Dropdown -->
        <div class="filter-select-wrapper">
          <i class="bi bi-star select-prefix-icon"></i>
          <select
            class="filter-select-control"
            [value]="selectedRoleFilter()"
            (change)="onRoleFilterChange($event)"
          >
            <option value="">Tous les rôles</option>
            <option value="principal">Principal</option>
            <!-- <option value="adjoint">Catéchiste Adjoint</option> -->
            <option value="assistant">Assistant</option>
          </select>
          <i class="bi bi-chevron-down select-chevron-icon"></i>
        </div>

        <!-- Classe Filter Dropdown -->
        <div class="filter-select-wrapper">
          <i class="bi bi-mortarboard select-prefix-icon"></i>
          <select
            class="filter-select-control"
            [value]="selectedClasseFilter()"
            (change)="onClasseFilterChange($event)"
          >
            <option value="">Toutes les classes</option>
            @for (cls of classes(); track cls.id) {
              <option [value]="cls.id">{{ cls.nom }}</option>
            }
          </select>
          <i class="bi bi-chevron-down select-chevron-icon"></i>
        </div>
      </div>

      <!-- Right Meta Info & Reset Button -->
      <div class="filters-right">
        @if (hasActiveFilters()) {
          <button class="reset-filter-btn" (click)="resetAllFilters()">
            <i class="bi bi-arrow-counterclockwise"></i>
            <span>Réinitialiser</span>
          </button>
        }
        <span class="count-pill">
          <strong>{{ filteredAffectations().length }}</strong> affectation(s)
        </span>
      </div>
    </div>

    <!-- Affectations Table Sub-component with Action Icons & Pagination -->
    <app-affectation-table
      [affectations]="filteredAffectations()"
      (createRequested)="openCreateModal()"
      (viewRequested)="handleView($event)"
      (editRequested)="openEditModal($event)"
      (deleteRequested)="openDeleteModal($event)"
      (toggleRoleRequested)="handleToggleRole($event)"
    />
  </app-card>
</div>

<!-- Affectation Form Modal Sub-component -->
<app-affectation-form-modal
  [isOpen]="isFormModalOpen()"
  [isEditing]="isEditing()"
  [affectationToEdit]="selectedAffectation()"
  [animateurs]="animateurs()"
  [classes]="classes()"
  [existingAffectations]="affectations()"
  [isLoading]="isLoading()"
  (formClosed)="closeFormModal()"
  (formSubmitted)="handleFormSubmit($event)"
/>

<!-- Affectation Delete Modal Sub-component -->
<app-affectation-delete-modal
  [isOpen]="isDeleteModalOpen()"
  [itemToDelete]="itemToDelete()"
  [isLoading]="isLoading()"
  (modalClosed)="closeDeleteModal()"
  (confirmed)="handleDeleteConfirm()"
/>
