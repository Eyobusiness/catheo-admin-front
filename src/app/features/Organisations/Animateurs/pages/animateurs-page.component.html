<div class="animateurs-page">
  <!-- Topbar Header -->
  <section class="page-topbar">
    <div class="topbar-headings">
      <h2 class="topbar-title">Animateurs</h2>
      <p class="topbar-subtitle">Gestion des animateurs.</p>
    </div>

    <div class="topbar-actions">
      <app-button
        variant="primary"
        size="md"
        icon="plus"
        (clicked)="openCreateModal()"
      >
        Ajouter un Catéchiste
      </app-button>
    </div>
  </section>

  <!-- Main Table Card -->
  <app-card
    title="Répertoire des Catéchistes">
    <!-- Table Controls Toolbar -->
    <div class="filters-toolbar">
      <!-- Left Filters Group -->
      <div class="filters-left">
        <!-- Search Input -->
        <div class="search-input-wrapper">
          <i class="bi bi-search search-icon"></i>
          <input
            type="text"
            class="filter-search-control"
            placeholder="Rechercher..."
            [value]="searchQuery()"
            (input)="onSearchChange($event)"
          />
          @if (searchQuery()) {
            <button class="clear-search-btn" (click)="clearSearch()" title="Effacer la recherche">
              <i class="bi bi-x-circle-fill"></i>
            </button>
          }
        </div>

        <!-- Sexe Filter Dropdown -->
        <div class="filter-select-wrapper">
          <i class="bi bi-gender-ambiguous select-prefix-icon"></i>
          <select
            class="filter-select-control"
            [value]="selectedSexeFilter()"
            (change)="onSexeFilterChange($event)"
          >
            <option value="">Tous les genres</option>
            <option value="M">Masculin (M)</option>
            <option value="F">Féminin (F)</option>
          </select>
          <i class="bi bi-chevron-down select-chevron-icon"></i>
        </div>

        <!-- Statut Filter Dropdown -->
        <div class="filter-select-wrapper">
          <i class="bi bi-toggle-on select-prefix-icon"></i>
          <select
            class="filter-select-control"
            [value]="selectedStatutFilter()"
            (change)="onStatutFilterChange($event)"
          >
            <option value="">Tous les statuts</option>
            <option value="actif">Actif </option>
            <option value="inactif">Inactif</option>
          </select>
          <i class="bi bi-chevron-down select-chevron-icon"></i>
        </div>
      </div>

      <!-- Right Meta Info & Reset Button -->
      <div class="filters-right">
        @if (hasActiveFilters()) {
          <button class="reset-filter-btn" (click)="resetAllFilters()">
            <i class="bi bi-arrow-counterclockwise"></i>
            <span>Réinitialiser</span>
          </button>
        }
        <span class="count-pill">
          <strong>{{ filteredAnimateurs().length }}</strong> catéchiste(s)
        </span>
      </div>
    </div>

    <!-- Animateurs Table Sub-component with Action Icons & Pagination -->
    <app-animateur-table
      [animateurs]="filteredAnimateurs()"
      (createRequested)="openCreateModal()"
      (viewRequested)="handleView($event)"
      (editRequested)="openEditModal($event)"
      (deleteRequested)="openDeleteModal($event)"
      (toggleStatusRequested)="handleToggleStatus($event)"
    />
  </app-card>
</div>

<!-- Animateur Form Modal Sub-component -->
<app-animateur-form-modal
  [isOpen]="isFormModalOpen()"
  [isEditing]="isEditing()"
  [animateurToEdit]="selectedAnimateur()"
  [isLoading]="isLoading()"
  (formClosed)="closeFormModal()"
  (formSubmitted)="handleFormSubmit($event)"
/>

<!-- Animateur Delete Modal Sub-component -->
<app-animateur-delete-modal
  [isOpen]="isDeleteModalOpen()"
  [itemToDelete]="itemToDelete()"
  [isLoading]="isLoading()"
  (modalClosed)="closeDeleteModal()"
  (confirmed)="handleDeleteConfirm()"
/>
