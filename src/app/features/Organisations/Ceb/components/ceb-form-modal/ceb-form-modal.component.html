<app-dialog
  [isOpen]="isOpen()"
  [title]="isEditing() ? 'Modifier la CEB' : 'Nouvelle Communauté (CEB)'"
  subtitle="Organisation • Communauté Ecclésiale de Base"
  size="md"
  (closed)="onClose()"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" dialog-body class="ceb-form">
    <!-- Nom de la CEB -->
    <div class="form-group">
      <label class="form-label" for="nom">
        Nom de la Communauté (CEB) <span class="required">*</span>
      </label>
      <input
        id="nom"
        type="text"
        formControlName="nom"
        class="form-control"
        placeholder="Nom"
      />
      @if (form.controls.nom.touched && form.controls.nom.invalid) {
        <span class="field-error">Le nom de la CEB est obligatoire (min. 3 caractères).</span>
      }
    </div>

    <!-- Responsable & Téléphone Row -->
    <div class="form-row col-2">
      <div class="form-group">
        <label class="form-label" for="responsable">
          Responsable de la CEB
        </label>
        <input
          id="responsable"
          type="text"
          formControlName="responsable"
          class="form-control"
          placeholder="Responsable"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="telephone">
          Téléphone de Contact
        </label>
        <input
          id="telephone"
          type="text"
          formControlName="telephone"
          class="form-control"
          placeholder="Téléphone"
        />
      </div>
    </div>

    <!-- Adresse & Secteur -->
    <div class="form-group">
      <label class="form-label" for="adresse">
        Adresse / Quartier / Secteur
      </label>
      <input
        id="adresse"
        type="text"
        formControlName="adresse"
        class="form-control"
        placeholder="Adresse"
      />
    </div>

    <!-- Description -->
    <div class="form-group">
      <label class="form-label" for="description">
        Description & Limites géographiques
      </label>
      <textarea
        id="description"
        rows="2"
        formControlName="description"
        class="form-control"
        placeholder="Description"
      ></textarea>
    </div>

    <!-- Statut -->
    <div class="form-group">
      <label class="form-label" for="statut">
        Statut de la CEB
      </label>
      <select id="statut" formControlName="statut" class="form-control">
        <option value="Active">Active (En activité)</option>
        <option value="Inactive">Inactive</option>
      </select>
    </div>
  </form>

  <div dialog-footer>
    <app-button variant="secondary" (clicked)="onClose()">
      Annuler
    </app-button>
    <app-button
      variant="primary"
      icon="check"
      [loading]="isLoading()"
      (clicked)="onSubmit()"
    >
      {{ isEditing() ? 'Enregistrer' : 'Créer la CEB' }}
    </app-button>
  </div>
</app-dialog>
