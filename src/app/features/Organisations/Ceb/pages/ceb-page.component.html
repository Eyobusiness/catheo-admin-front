<div class="ceb-page">
  <!-- Topbar Header -->
  <section class="page-topbar">
    <div class="topbar-headings">
      <h2 class="topbar-title">Communautés Ecclésiales de Base (CEB)</h2>
      <p class="topbar-subtitle">Gestion  des CEB.</p>
    </div>

    <div class="topbar-actions">
      <app-button
        variant="primary"
        size="md"
        icon="plus"
        (clicked)="openCreateModal()"
      >
        Créer une CEB
      </app-button>
    </div>
  </section>

  <!-- Main Table Card -->
  <app-card
    title="Répertoire des CEB">
    <!-- Table Controls Toolbar -->
    <div class="filters-toolbar">
      <!-- Left Filters Group -->
      <div class="filters-left">
        <!-- Search Input -->
        <div class="search-input-wrapper">
          <i class="bi bi-search search-icon"></i>
          <input
            type="text"
            class="filter-search-control"
            placeholder="Rechercher une CEB..."
            [value]="searchQuery()"
            (input)="onSearchChange($event)"
          />
          @if (searchQuery()) {
            <button class="clear-search-btn" (click)="clearSearch()" title="Effacer la recherche">
              <i class="bi bi-x-circle-fill"></i>
            </button>
          }
        </div>

        <!-- Statut Filter Dropdown -->
        <div class="filter-select-wrapper">
          <i class="bi bi-toggle-on select-prefix-icon"></i>
          <select
            class="filter-select-control"
            [value]="selectedStatutFilter()"
            (change)="onStatutFilterChange($event)"
          >
            <option value="">Tous les statuts</option>
            <option value="active">Active uniquement</option>
            <option value="inactive">Inactive uniquement</option>
          </select>
          <i class="bi bi-chevron-down select-chevron-icon"></i>
        </div>
      </div>

      <!-- Right Meta Info & Reset Button -->
      <div class="filters-right">
        @if (hasActiveFilters()) {
          <button class="reset-filter-btn" (click)="resetAllFilters()">
            <i class="bi bi-arrow-counterclockwise"></i>
            <span>Réinitialiser</span>
          </button>
        }
        <span class="count-pill">
          <strong>{{ filteredCebs().length }}</strong> CEB(s)
        </span>
      </div>
    </div>

    <!-- CEB Table Sub-component with Action Icons & Pagination -->
    <app-ceb-table
      [cebs]="filteredCebs()"
      (createRequested)="openCreateModal()"
      (viewRequested)="handleView($event)"
      (editRequested)="openEditModal($event)"
      (deleteRequested)="openDeleteModal($event)"
      (toggleStatusRequested)="handleToggleStatus($event)"
    />
  </app-card>
</div>

<!-- CEB Form Modal Sub-component -->
<app-ceb-form-modal
  [isOpen]="isFormModalOpen()"
  [isEditing]="isEditing()"
  [cebToEdit]="selectedCeb()"
  [isLoading]="isLoading()"
  (formClosed)="closeFormModal()"
  (formSubmitted)="handleFormSubmit($event)"
/>

<!-- CEB Delete Modal Sub-component -->
<app-ceb-delete-modal
  [isOpen]="isDeleteModalOpen()"
  [itemToDelete]="itemToDelete()"
  [isLoading]="isLoading()"
  (modalClosed)="closeDeleteModal()"
  (confirmed)="handleDeleteConfirm()"
/>
