<app-dialog
  [isOpen]="isOpen()"
  title="Supprimer le Versement"
  size="sm"
  (closed)="onClose()"
>
  <div class="delete-modal-body">
    <div class="delete-icon-wrapper">
      <i class="bi bi-exclamation-triangle"></i>
    </div>

    <div class="delete-content">
      <h4 class="delete-title">Supprimer ce versement ?</h4>
      @if (itemToDelete(); as item) {
        <p class="delete-desc">
          Le versement <strong>« {{ item.reference }} »</strong> de <strong>{{ item.montant_verse }} FCFA</strong> pour <strong>{{ item.periode_concernee }}</strong> sera supprimé.
        </p>
      }
    </div>

    <div class="modal-footer-actions">
      <app-button
        type="button"
        variant="ghost"
        (clicked)="onClose()"
        [disabled]="isLoading()"
      >
        Annuler
      </app-button>

      <app-button
        type="button"
        variant="danger"
        [loading]="isLoading()"
        (clicked)="onConfirm()"
      >
        <i class="bi bi-trash3"></i>
        <span>Supprimer définitivement</span>
      </app-button>
    </div>
  </div>
</app-dialog>
