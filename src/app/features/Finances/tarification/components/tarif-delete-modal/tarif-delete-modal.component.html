<app-dialog
  [isOpen]="isOpen()"
  title="Supprimer le Tarif"
  size="sm"
  (closed)="onClose()"
>
  <div class="delete-modal-body">
    <div class="delete-icon-wrapper">
      <i class="bi bi-exclamation-triangle"></i>
    </div>

    <div class="delete-content">
      <h4 class="delete-title">Supprimer cet élément tarifaire ?</h4>
      @if (itemToDelete(); as item) {
        <p class="delete-desc">
          Le tarif <strong>« {{ item.intitule }} »</strong> de montant <strong>{{ item.montant }} FCFA</strong> sera supprimé de la grille.
        </p>
      }
    </div>

    <div class="modal-footer-actions">
      <app-button
        type="button"
        variant="ghost"
        (clicked)="onClose()"
        [disabled]="isLoading()"
      >
        Annuler
      </app-button>

      <app-button
        type="button"
        variant="danger"
        [loading]="isLoading()"
        (clicked)="onConfirm()"
      >
        <i class="bi bi-trash3"></i>
        <span>Supprimer définitivement</span>
      </app-button>
    </div>
  </div>
</app-dialog>
